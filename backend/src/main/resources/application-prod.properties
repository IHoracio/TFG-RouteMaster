# API Keys
evolutivo.api_key_google=${GOOGLE_KEY}
evolutivo.api_key_openweather=${OPENWEATHER_KEY}
evolutivo.auth.secret-cookie-key=${COOKIE_AUTH_SECRET_KEY}

# Logging Configuration
logging.level.root=INFO
logging.level.es.metrica.sept25.evolutivo.service=DEBUG
logging.level.es.metrica.sept25.evolutivo.controller=DEBUG
logging.level.org.springframework.security=DEBUG

# Network
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL}/routemaster?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWD}

# docs/swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Cors
cors.allowed.origins=https://routemaster.mariomartinmorilla.es
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# URL base del frontend
app.frontend.url=https://routemaster.mariomartinmorilla.es
