services:
  mysql-db:
    image: mysql:8.0
    container_name: routemaster-db
    restart: unless-stopped
    networks:
      - routemaster-net
    environment:
      MYSQL_DATABASE: routemaster_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

  routemaster-backend:
    build: ./backend
    container_name: routemaster-backend
    restart: unless-stopped
    networks:
      - routemaster-net
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://routemaster-db:3306/routemaster_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - mysql-db

  routemaster-frontend:
    build: ./frontend
    container_name: routemaster-frontend
    restart: unless-stopped
    networks:
      - routemaster-net
    ports:
      - "80:8080"
    depends_on:
      - routemaster-backend

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: routemaster-jenkins
    restart: unless-stopped
    networks:
      - routemaster-net
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/routemaster:/opt/routemaster

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    networks:
      - routemaster-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    depends_on:
      - routemaster-frontend
      - routemaster-backend
      - jenkins

networks:
  routemaster-net:
    driver: bridge

volumes:
  mysql-data:
